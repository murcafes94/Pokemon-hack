name: Legacy source prerequisites

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-prerequisites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check editable sources before enabling ROM compilation
        run: python3 tools/legacy_localization/check_source_tree.py
